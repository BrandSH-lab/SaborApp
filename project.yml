name: SaborApp
options:
  bundleIdPrefix: com.saborapp
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SaborApp:
    type: application
    platform: iOS
    sources:
      - path: SaborApp/SaborApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saborapp.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SaborApp:
    build:
      targets:
        SaborApp: all
